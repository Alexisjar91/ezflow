services:
  app:
    build: .
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      # env vars for dev environment
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=ezflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: